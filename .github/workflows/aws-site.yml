name: Publish AWS website
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: canopy-aws-site
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CANOPY_STACK: ${{ vars.CANOPY_STACK || 'canopy-site' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicitly configured AWS role
        run: test -n "$AWS_ROLE_ARN" || { echo 'Configure AWS_ROLE_ARN for GitHub OIDC, or use the documented CloudShell deployment.' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build:site
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: node scripts/publish-site.mjs
